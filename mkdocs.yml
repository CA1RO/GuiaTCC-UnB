site_name: GuiaOrientador-UnB
site_description: Documentação da entrega E1 de Sistemas de Banco de Dados 2
site_url: https://ca1ro.github.io/GuiaTCC-UnB/
repo_url: https://github.com/CA1RO/GuiaTCC-UnB
repo_name: CA1RO/GuiaTCC-UnB
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  favicon: favicon.svg
  palette:
    primary: green
    accent: amber
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables

nav:
  - Início: index.md
  - Entrega 1:
      - Visão da entrega: e1/index.md
      - Domínio e pergunta: e1/01-dominio-e-pergunta.md
      - Esquema e migrações: e1/02-esquema-e-migracoes.md
      - Carga reproduzível: e1/03-carga-reprodutivel.md
      - Volume: e1/04-volume.md
      - Caracterização da carga: e1/05-caracterizacao-da-carga.md
      - Histórico da origem: e1/06-historico-da-origem.md
      - ADR 0001: adr/0001-modelar-docentes-e-programas-capes.md
