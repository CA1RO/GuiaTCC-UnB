[project]
name = "guia-orientador-unb"
version = "0.1.0"
description = "Sistema para auxiliar alunos da UnB a encontrar orientadores e temas de TCC via busca semântica (RAG)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
